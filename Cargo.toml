[package]
name = "blink"
version = "0.1.0"
edition = "2024"
description = "A fast, minimal Linux screenshot utility"
license = "MIT"

[dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts", "open_uri", "screenshot"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
directories = "6"
futures-util = "0.3"
gtk = { package = "gtk4", version = "0.11" }
ksni = "0.3"
notify-rust = { version = "4.18", default-features = false, features = ["z-with-tokio"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync"] }

[profile.release]
lto = "thin"
strip = true
